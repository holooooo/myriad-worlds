<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23111e20'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='Georgia,serif' font-size='43' fill='%23d5b77b'%3EM%3C/text%3E%3C/svg%3E">
<title>万境 · Myriad Worlds — Living Procedural Landscapes</title>
<meta name="description" content="万境 Myriad Worlds: explore living procedural landscapes, from Chinese mountain lakes and palace cities to Japanese blossom forests and castle towns.">
<style>
:root{color-scheme:dark;--ink:#111e20;--panel:rgba(15,27,29,.94);--paper:#f2efdf;--muted:#b5beb6;--line:rgba(229,229,204,.17);--accent:#d5b77b;--serif:"Songti SC","Noto Serif SC",Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}[hidden]{display:none!important}body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;overflow:hidden;background:var(--ink);color:var(--paper);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button:disabled{cursor:default;opacity:.55}
#scene{display:block;width:100vw;height:100dvh;touch-action:none}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111e20;z-index:999;pointer-events:none;transition:opacity .9s}#loader.done{opacity:0}
#ldLogo{font-family:var(--serif);font-size:clamp(3rem,8vw,5rem);letter-spacing:.18em;line-height:1.4;text-align:center;margin-bottom:2rem}#ldLogo small{display:block;font:500 .7rem system-ui;letter-spacing:.35em;color:var(--accent);margin-top:.5rem}
#ldBar{width:min(20rem,76vw);height:2px;background:var(--line);margin-bottom:1rem}#ldFill{height:100%;background:var(--accent);transform-origin:left;transition:transform .35s}#ldStatus{font-size:.8rem;color:var(--muted);text-align:center;max-width:90vw}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:.85rem;transition:opacity .35s}#topBar{display:flex;align-items:flex-start;justify-content:space-between;padding:24px 28px;gap:1rem}#title{pointer-events:auto;text-shadow:0 2px 12px #0008}#title h1{font-family:var(--serif);font-weight:500;font-size:1.8rem;letter-spacing:.15em;line-height:1.2}#title h1 small{display:inline-block;font:500 .62rem system-ui;letter-spacing:.17em;margin-left:12px;color:var(--paper)}#worldBadge{display:inline-block;margin-top:12px;padding:5px 9px;border:1px solid #eee4;background:#152422b3;font-size:.67rem;letter-spacing:.08em}#moodLine{font-size:.75rem;color:#e7e8d6;margin-top:8px}
#topTools{display:flex;flex-direction:column;align-items:flex-end;gap:10px;pointer-events:auto}#languageControl{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;width:44px;height:36px;background:var(--panel);border:1px solid var(--line);cursor:pointer}#languageControl:after{content:'⌄';font-size:.65rem;color:var(--muted)}#languageControl:focus-within{outline:2px solid var(--accent);outline-offset:4px}#languageFlag{font-size:1.15rem;line-height:1}#languageSelect{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font:inherit;background:var(--panel);color:var(--paper)}#languageSelect option{font-size:.8rem}.srOnly{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}#stats{display:flex;gap:22px;background:var(--panel);border:1px solid var(--line);padding:12px 18px;pointer-events:auto}.stat{display:flex;flex-direction:column;gap:5px}.statVal{font-size:.9rem;font-variant-numeric:tabular-nums}.statLbl{font-size:.55rem;letter-spacing:.13em;color:var(--muted)}
#controls{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 48px);background:var(--panel);border:1px solid var(--line);padding:7px;box-shadow:0 10px 30px #0003;pointer-events:auto}#moods,#actions{display:flex;gap:3px;align-items:center}#moods{border-right:1px solid var(--line);padding-right:12px}#controls button{min-height:42px;padding:7px 11px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}#controls button:hover{background:#eff0d412;color:var(--paper)}#controls button[aria-pressed="true"]{background:#d5b77b20;color:var(--accent)}#moods button{display:flex;flex-direction:column;gap:3px;align-items:center;font-size:.65rem;min-width:47px;padding:6px}#moods .ico{display:block;width:19px;height:19px}#controls svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}#actions button{display:flex;gap:7px;align-items:center;font-size:.76rem}#actions .iconOnly{padding:9px}
#menu{display:none;position:fixed;inset:0;background:#081113a8;backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:24px;pointer-events:auto}#menu.show{display:flex}#menuBox{background:#142326;border:1px solid var(--line);padding:30px;max-width:760px;width:100%;max-height:86dvh;overflow-y:auto;box-shadow:0 22px 80px #0005}#menuBox h2{font-family:var(--serif);font-weight:500;font-size:1.7rem;letter-spacing:.06em;margin-bottom:12px}#menuBox h3{font-size:.75rem;letter-spacing:.08em;color:var(--accent);margin:24px 0 10px}#menuBox p,#menuBox li{font-size:.82rem;color:var(--muted);line-height:1.75}#menuBox p{margin-bottom:12px}#menuBox ul{list-style:none;display:grid;gap:8px}#menuBox b{font-weight:550;color:var(--paper)}#menuBox label{display:flex;gap:10px;align-items:center;margin:12px 0;color:var(--muted)}#menuBox input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}.btnRow{display:flex;gap:8px;margin-top:24px;flex-wrap:wrap}.btnPri,.btnSec{padding:11px 18px;border:1px solid var(--line);font-size:.82rem}.btnPri{background:var(--accent);color:#152326;border-color:var(--accent)}.btnPri:hover{background:#e8c98d}.btnSec{background:#f0ecd007;color:var(--paper)}.btnSec:hover{border-color:var(--accent);background:#d5b77b10}.worldGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.worldCard{display:flex;flex-direction:column;text-align:left;gap:12px;padding:22px;border:1px solid var(--line);background:#f0ecd007}.worldCard:hover{border-color:var(--accent)}.worldCard[aria-current="true"]{border-color:var(--accent);background:#d5b77b12}.worldCard .index{color:var(--accent);font-size:.65rem;letter-spacing:.15em}.worldCard strong{font-family:var(--serif);font-size:1.4rem;font-weight:500}.worldCard span:last-child{font-size:.75rem;color:var(--muted);line-height:1.6}.futureWorld{padding:14px 0;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
#seedBox{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}#seedBox input{flex:1;min-width:140px;background:#0002;border:1px solid var(--line);padding:10px 12px;color:var(--paper)}#teleList{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}#teleList button{text-align:left;min-height:72px;padding:14px}#teleList span{display:block;margin-top:5px;font-size:.7rem;color:var(--muted)}#unitList{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
#fatal{position:fixed;inset:0;background:var(--ink);z-index:999;display:grid;place-items:center;padding:2rem}#fatal>div{max-width:40rem}#fatalTitle{font-family:var(--serif);font-size:1.8rem;color:var(--accent);margin-bottom:1rem}#fatalMsg{color:var(--muted);line-height:1.6;margin-bottom:1rem}#fatalCode{background:#0002;border:1px solid var(--line);padding:1rem;font-size:.8rem;color:var(--muted);overflow:auto;max-height:12rem}
#loadSnap{position:fixed;bottom:96px;right:28px;padding:6px 10px;background:var(--panel);color:var(--muted);font-size:.65rem;z-index:20;pointer-events:none}#toast{position:fixed;top:110px;left:50%;transform:translateX(-50%);padding:10px 18px;background:var(--panel);border:1px solid var(--line);font-size:.8rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30;max-width:86vw;text-align:center}#toast.on{opacity:1}body.hidden-ui #hud{opacity:0;pointer-events:none}
body.touring #hud>:not(#topBar),body.touring #topTools,body.touring #menu,body.touring #toast,body.touring #loadSnap{display:none!important}body.touring #title{pointer-events:none}
@media(max-width:1100px){#controls{gap:8px}#controls button{padding:7px 8px}#actions button{font-size:.7rem}#moods{padding-right:8px}}
@media(max-width:900px){#controls{flex-direction:column;gap:3px;width:max-content}#moods{border-right:0;border-bottom:1px solid var(--line);padding:0 0 5px;width:100%;justify-content:center}#moods button{flex:1;flex-direction:row;justify-content:center;min-height:34px}#actions{justify-content:center}#loadSnap{bottom:136px}}
@media(max-width:600px){#topBar{padding:18px 16px}#title h1{font-size:1.5rem}#title h1 small{display:block;margin:7px 0 0;font-size:.5rem}#worldBadge{font-size:.58rem;margin-top:10px}#stats{gap:12px;padding:9px 10px}.statVal{font-size:.7rem}.statLbl{font-size:.45rem}.stat:first-child{display:none}#controls{bottom:max(12px,env(safe-area-inset-bottom));max-width:calc(100vw - 24px);padding:5px}#actions{gap:0}#actions button{font-size:.62rem;padding:6px 7px;min-height:38px}#actions svg{width:17px;height:17px}#moods button{font-size:.6rem;padding:5px}#menu{padding:12px}#menuBox{padding:22px 18px;max-height:90dvh}.worldGrid{gap:8px}.worldCard{padding:14px}.worldCard strong{font-size:1.2rem}#toast{top:132px}#loadSnap{right:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loader">
  <div id="ldLogo"><span data-i18n="product.name">万境</span><small data-i18n="product.subtitle">MYRIAD WORLDS</small></div>
  <div id="ldBar"><div id="ldFill" style="transform:scaleX(0)"></div></div>
  <div id="ldStatus" data-i18n="loading.initialize">正在初始化…</div>
</div>
<div id="hud" hidden>
  <div id="topBar">
    <div id="title">
      <h1><span data-i18n="product.name">万境</span><small data-i18n="product.subtitle">MYRIAD WORLDS</small></h1>
      <div id="worldBadge">山水 · SHANSHUI</div>
      <div id="moodLine">暮光 · Golden hour</div>
    </div>
    <div id="topTools">
      <label id="languageControl" data-i18n-title="language" title="语言"><span class="srOnly" data-i18n="language">语言</span><span id="languageFlag" aria-hidden="true">🇨🇳</span><select id="languageSelect" data-i18n-aria="language" aria-label="语言"><option value="zh" lang="zh-CN">🇨🇳 中文</option><option value="ja" lang="ja">🇯🇵 日本語</option><option value="en" lang="en">🇬🇧 English</option></select></label>
    <div id="stats">
      <div class="stat"><div class="statVal" id="altVal">—</div><div class="statLbl" data-i18n="stat.altitude">海拔</div></div>
      <div class="stat"><div class="statVal" id="bioVal">—</div><div class="statLbl" data-i18n="stat.biome">群落</div></div>
      <div class="stat"><div class="statVal" id="fpsVal">—</div><div class="statLbl" data-i18n="stat.fps">帧率</div></div>
    </div>
    </div>
  </div>
  <div id="controls">
    <div id="moods" role="group" data-i18n-aria="mood.group" aria-label="天气与时段">
      <button data-mood="morning" data-i18n-title="mood.morning" aria-pressed="false" title="晨雾 · Morning"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 16h18M5 20h14M8 12a4 4 0 0 1 8 0M12 2v3M3 7l2 2m16-2-2 2"/></svg></span><span data-i18n="mood.morning">晨雾</span></button>
      <button data-mood="golden" data-i18n-title="mood.golden" aria-pressed="true" title="暮光 · Golden hour"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg></span><span data-i18n="mood.golden">暮光</span></button>
      <button data-mood="dusk" data-i18n-title="mood.dusk" aria-pressed="false" title="薄暮 · Dusk"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 17h18M5 21h14M8 13a4 4 0 0 1 8 0M12 3v4m-3-3 3 3 3-3"/></svg></span><span data-i18n="mood.dusk">薄暮</span></button>
      <button data-mood="night" data-i18n-title="mood.night" aria-pressed="false" title="月夜 · Night"><span class="ico"><svg viewBox="0 0 24 24"><path d="M19 16A8 8 0 0 1 8 5a8 8 0 1 0 11 11Z"/><path d="m18 3 .7 2.3L21 6l-2.3.7L18 9l-.7-2.3L15 6l2.3-.7Z"/></svg></span><span data-i18n="mood.night">月夜</span></button>
      <button data-mood="rain" data-i18n-title="mood.rain" aria-pressed="false" title="细雨 · Rain"><span class="ico"><svg viewBox="0 0 24 24"><path d="M6 14a4 4 0 1 1 1-8 5 5 0 0 1 9 1 3.5 3.5 0 1 1 2 7H6ZM7 18l-1 3m6-3-1 3m6-3-1 3"/></svg></span><span data-i18n="mood.rain">细雨</span></button>
    </div>
    <div id="actions">
      <button id="btnWorld" data-i18n="action.world" data-i18n-title="action.world.title" title="选择世界 · Worlds">世界</button>
      <button id="btnTele" data-i18n="action.places" data-i18n-title="action.places.title" title="景点与种子 · Places & seed">寻境</button>
      <button id="btnFollow" data-i18n="action.follow" data-i18n-title="action.follow.title" aria-pressed="false" title="第一视角跟随 · Follow a moving unit">跟随</button>
      <button id="btnTour" data-i18n="action.tour" data-i18n-title="action.tour.title" aria-pressed="false" title="环游 · Orbit (T)">环游</button>
      <button id="btnSound" data-i18n-title="action.sound" data-i18n-aria="action.sound" class="iconOnly" aria-label="环境音 · Ambient sound" aria-pressed="false" title="环境音 · Ambient sound"><span class="snd-off"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4ZM16 9l5 6m0-6-5 6"/></svg></span><span class="snd-on" style="display:none"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4ZM15 8a6 6 0 0 1 0 8m3-12a11 11 0 0 1 0 16"/></svg></span></button>
      <button id="btnShot" data-i18n-title="action.shot.title" data-i18n-aria="action.shot" class="iconOnly" aria-label="保存截图 · Screenshot" title="留影 · Screenshot (P)"><svg viewBox="0 0 24 24"><path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/></svg></button>
      <button id="btnHelp" data-i18n="action.guide" data-i18n-title="action.guide.title" title="操作指南 · Guide">指南</button>
    </div>
  </div>
</div>
<div id="menu">
  <div id="menuBox" role="dialog" aria-labelledby="menuTitle"></div>
</div>
<div id="fatal" hidden>
  <div><div id="fatalTitle"></div><div id="fatalMsg"></div><pre id="fatalCode"></pre></div>
</div>
<div id="toast" class="glass"></div>
<div id="loadSnap" hidden></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.171.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.171.0/examples/jsm/"}}</script>
<script id="gen-src" type="text/plain">GEN_SOURCE_PLACEHOLDER</script>
<script type="module">
// This script block will contain the concatenated engine, streaming, atmosphere, fx, controls, ui, and boot code
ENGINE_STREAMING_ATMO_FX_CONTROLS_UI_BOOT_PLACEHOLDER
</script>
</body>
</html>
