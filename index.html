    else out.lerp(PAL.canSato, 0.45);
    return out;
  }
  if (s.biome === B.SAKURA) {
    const p = clamp(s.sak * 2.2 - 0.3, 0, 0.6);
    if (j2 < p * 0.45) out.lerp(PAL.petal, 0.55 + j * 0.2); else out.lerp(PAL.petal, p * 0.12);
  } else if (fbm(x * 0.02, z * 0.02, 2, 17) > 0.32 && j2 > 0.55) out.lerp(PAL.nanohana, 0.75);
  if (slope > 0.8) out.lerp(PAL.soil, (slope - 0.8) * 0.6);
  return out;
}

// ---------------------------------------------------------------------
//  Chunk generation
// ---------------------------------------------------------------------
const LODS = [
  { size: 32, cs: 1, q: 0.25 },
  { size: 64, cs: 2, q: 0.75 },
  { size: 128, cs: 4, q: 1.5 },
  { size: 256, cs: 8, q: 3 },
  { size: 512, cs: 16, q: 6 },
];
const quant = (h, q) => Math.round(h / q) * q;

function genChunk(cx, cz, lod) {
  const L = LODS[lod], N = Math.round(L.size / L.cs), cs = L.cs, q = L.q;
  const x0 = cx * L.size, z0 = cz * L.size;
  const W = N + 2;
  const raw = new Float32Array(W * W), hq = new Float32Array(W * W);
  const info = new Array(W * W);
  for (let j = 0; j < W; j++) for (let i = 0; i < W; i++) {
    const x = x0 + (i - 0.5) * cs, z = z0 + (j - 0.5) * cs;
    const s = sample(x, z, {});
    const k = j * W + i;
    raw[k] = s.h; info[k] = s;
    if (lod === 0) hq[k] = (s.h < -0.5) ? quant(s.h, q * 0.5) : quant(s.h, q);
    else {
      // far LODs: average the raw height over the cell footprint (kills the 1m staircase driver)
      const avg = (s.h * 2 + natural(x + cs * 0.5, z, {}).h + natural(x - cs * 0.5, z, {}).h + natural(x, z + cs * 0.5, {}).h + natural(x, z - cs * 0.5, {}).h) / 6;
      hq[k] = avg;
    }
    if (s.paddy) hq[k] = s.plate;
    // a cell claimed by another biome loses its paddy flat/levee (biome noise wobbles edges)
    if (s.paddy && s.biome !== B.PADDY) { info[k].paddy = 0; hq[k] = (s.h < -0.5) ? quant(s.h, q * 0.5) : quant(s.h, q); }
  }
  // gentle 3-tap smoothing on hills kills the grazing-light staircase shimmer
  if (lod === 0) {
    const hq2 = hq.slice();
    for (let j = 1; j <= N; j++) for (let i = 1; i <= N; i++) {
      const k = j * W + i, s = info[k];
      if (s.street || s.rail > 0.1 || s.pad > 0.2 || s.paddy || s.h < 0.2) continue;
      const steep = Math.max(Math.abs(raw[k] - raw[k + 1]), Math.abs(raw[k] - raw[k - 1]), Math.abs(raw[k] - raw[k + W]), Math.abs(raw[k] - raw[k - W]));
      if (steep > cs * 0.55) continue;
      hq[k] = (hq2[k] * 2 + hq2[k - 1] + hq2[k + 1] + hq2[k - W] + hq2[k + W]) / 6;
    }
  }
  // paddy levees: plate cells bordering a lower or non-paddy neighbour
  const levee = new Uint8Array(W * W);
  for (let j = 1; j <= N; j++) for (let i = 1; i <= N; i++) {
    const k = j * W + i, s = info[k];
    if (!s.paddy) continue;
    for (const d of [1, -1, W, -W]) { const t = info[k + d]; if (!t.paddy || t.plate < s.plate - 0.1) { levee[k] = 1; break; } }
  }
  for (let k = 0; k < W * W; k++) if (levee[k]) hq[k] += 0.25;

  // ---- terrain mesh ----
  const skirt = Math.max(3, cs * 4);
  const nb = (i, j, h) => {
    const v = hq[j * W + i];
    return (i < 1 || j < 1 || i > N || j > N) ? Math.min(v, (h !== undefined ? h : v) - skirt) : v;
  };
  let quads = 0;
  for (let j = 1; j <= N; j++) for (let i = 1; i <= N; i++) {
    const h = hq[j * W + i]; quads++;
    if (nb(i + 1, j, h) < h) quads++; if (nb(i - 1, j, h) < h) quads++; if (nb(i, j + 1, h) < h) quads++; if (nb(i, j - 1, h) < h) quads++;
  }
  // lod0 chunk borders: skirt walls down to the neighbour so seams never open
  const pos = new Float32Array(quads * 12), nor = new Float32Array(quads * 12), col = new Float32Array(quads * 12);
  const idx = quads * 4 > 65535 ? new Uint32Array(quads * 6) : new Uint16Array(quads * 6);
  let v = 0, f = 0;
  const put = (x, y, z, a, b, c, cc, k) => {
    const o = v * 3; pos[o] = x; pos[o + 1] = y; pos[o + 2] = z; nor[o] = a; nor[o + 1] = b; nor[o + 2] = c;
    col[o] = cc.r * k; col[o + 1] = cc.g * k; col[o + 2] = cc.b * k; v++;
  };
  const quad = () => { const b = v - 4, o = f * 6; idx[o] = b; idx[o + 1] = b + 1; idx[o + 2] = b + 2; idx[o + 3] = b; idx[o + 4] = b + 2; idx[o + 5] = b + 3; f++; };
  const top = new Col(), wt = new Col(), wb = new Col();
  let minY = 1e9, maxY = -1e9;
  const water = [], paddyW = [];
  for (let j = 1; j <= N; j++) for (let i = 1; i <= N; i++) {
    const k = j * W + i, h = hq[k], s = info[k];
    const xa = x0 + (i - 1) * cs, xb = xa + cs, za = z0 + (j - 1) * cs, zb = za + cs;
    const slope = Math.max(Math.abs(raw[k] - raw[k + 1]), Math.abs(raw[k] - raw[k - 1]), Math.abs(raw[k] - raw[k + W]), Math.abs(raw[k] - raw[k - W])) / cs;
    cellColor(xa + cs / 2, za + cs / 2, s, slope, lod >= 3 ? 1 : 0, top);
    if (levee[k]) top.copy(PAL.levee).multiplyScalar(0.85 + h2(i, j, 5) * 0.2);
    const under = h < -0.15;
    const rocky = slope > 1.6 || (s.biome === B.SNOW && !s.snow);
    if (under) { wt.copy(top).multiplyScalar(0.8); wb.copy(PAL.bedDeep).multiplyScalar(0.8); }
    else if (s.snow) { wt.copy(top).multiplyScalar(0.94); wb.copy(PAL.snowShade).multiplyScalar(0.72); }
    else if (rocky) { wt.copy(top).lerp(PAL.rock, 0.55).multiplyScalar(0.92); wb.copy(PAL.rockDark).multiplyScalar(0.62); }
    else if (s.street || s.path > 0.3 || s.rail > 0.3) { wt.copy(top).multiplyScalar(0.85); wb.copy(COL.stone).multiplyScalar(0.55); }
    else if (s.biome === B.BEACH) { wt.copy(top).multiplyScalar(0.88); wb.copy(PAL.sandWet).multiplyScalar(0.7); }
    else if (lod === 0) { wt.copy(top).multiplyScalar(0.92); wb.copy(top).lerp(PAL.soilDark, 0.35).multiplyScalar(0.8); }
    else { wt.copy(top).multiplyScalar(0.96); wb.copy(top).multiplyScalar(0.8); }
    const hE = nb(i + 1, j, h), hW = nb(i - 1, j, h), hN = nb(i, j + 1, h), hS = nb(i, j - 1, h);
    const th = 1e9, hv = (a, b) => hq[b * W + a];   // corner AO disabled: patchworked on slopes (waffle)
    const ao = (a, b, c) => 1 - 0.12 * ((a > h + th) + (b > h + th) + (c > h + th) * 0.7);
    put(xa, h, za, 0, 1, 0, top, ao(hv(i - 1, j), hv(i, j - 1), hv(i - 1, j - 1)));
    put(xa, h, zb, 0, 1, 0, top, ao(hv(i - 1, j), hv(i, j + 1), hv(i - 1, j + 1)));
    put(xb, h, zb, 0, 1, 0, top, ao(hv(i + 1, j), hv(i, j + 1), hv(i + 1, j + 1)));
    put(xb, h, za, 0, 1, 0, top, ao(hv(i + 1, j), hv(i, j - 1), hv(i + 1, j - 1)));
    quad();
    if (h < minY) minY = h; if (h > maxY) maxY = h;
    const wall = (hn, ax, az, bx, bz, nx_, nz_) => {
      const b = h - hn < 1.0 ? tc2.copy(wt).lerp(wb, 0.55) : wb;
      put(ax, hn, az, nx_, 0, nz_, b, 0.92); put(ax, h, az, nx_, 0, nz_, wt, 1); put(bx, h, bz, nx_, 0, nz_, wt, 1); put(bx, hn, bz, nx_, 0, nz_, b, 0.92); quad();
      if (hn < minY) minY = hn;
    };
    const eps = lod === 0 ? q * 0.3 : 0.55;   // LOD0: draw all real steps (dashes looked worse)
    if (hE < h - eps) wall(hE, xb, za, xb, zb, 1, 0);
    if (hW < h - eps) wall(hW, xa, zb, xa, za, -1, 0);
    if (hN < h - eps) wall(hN, xb, zb, xa, zb, 0, 1);
    if (hS < h - eps) wall(hS, xa, za, xb, za, 0, -1);
    if (h < 0) water.push(i, j);
    else if (s.paddy && !levee[k]) paddyW.push(i, j);
  }
  const terrain = { pos, nor, col, idx, minY, maxY: Math.max(maxY, 0) };
  // ---- water quads (y = 0) with per-vertex depth ----
  const mkWater = (list, yOf, depthOf) => {
    if (!list.length) return null;
    const n = list.length / 2;
    const wp = new Float32Array(n * 12), wd = new Float32Array(n * 4);
    const wi = n * 4 > 65535 ? new Uint32Array(n * 6) : new Uint16Array(n * 6);
    for (let t = 0; t < n; t++) {
      const i = list[t * 2], j = list[t * 2 + 1];
      const xa = x0 + (i - 1) * cs, za = z0 + (j - 1) * cs, y = yOf(i, j);
      const corner = [[0, 0], [0, 1], [1, 1], [1, 0]];
      for (let c = 0; c < 4; c++) {
        const ci = corner[c][0], cj = corner[c][1];
        wp[t * 12 + c * 3] = xa + ci * cs; wp[t * 12 + c * 3 + 1] = y; wp[t * 12 + c * 3 + 2] = za + cj * cs;
        let dsum = 0;
        for (const [di, dj] of [[ci - 1, cj - 1], [ci, cj - 1], [ci - 1, cj], [ci, cj]]) dsum += depthOf(i + di, j + dj);
        wd[t * 4 + c] = dsum / 4;
      }
      const b = t * 4, o = t * 6;
      wi[o] = b; wi[o + 1] = b + 1; wi[o + 2] = b + 2; wi[o + 3] = b; wi[o + 4] = b + 2; wi[o + 5] = b + 3;
    }
    return { pos: wp, depth: wd, idx: wi };
  };
  const waterM = mkWater(water, () => 0, (i, j) => clamp(-raw[clamp(j, 0, W - 1) * W + clamp(i, 0, W - 1)], -2, 12));
  const paddyM = mkWater(paddyW, (i, j) => hq[j * W + i] + 0.16, (i, j) => { const k = clamp(j, 0, W - 1) * W + clamp(i, 0, W - 1); return info[k].paddy && !levee[k] ? 0.45 : -0.3; });

  // ---- decorations ----
  kit.reset();
  const inChunk = (x, z) => x >= x0 && x < x0 + L.size && z >= z0 && z < z0 + L.size;
  const cellK = (x, z) => { const i = Math.floor((x - x0) / cs) + 1, j = Math.floor((z - z0) / cs) + 1; return (i < 0 || j < 0 || i >= W || j >= W) ? -1 : j * W + i; };
  kit.G = (x, z) => { const k = cellK(x, z); return k >= 0 ? hq[k] : quant(sample(x, z, {}).h, q); };
  const tufts = new FBuf(16 * 512), tuftC = new FBuf(3 * 512);
  if (lod === 0 && !window.__bareTerrain) decorate(x0, z0, L.size, info, hq, raw, W, cellK, inChunk, tufts, tuftC, levee);
  else decorateFar(x0, z0, L.size, lod, info, hq, raw, W, cellK, inChunk);
  const inst = {};
  for (const [name, b] of Object.entries(kit.b)) inst[name] = { m: b.m.out(), c: b.c.out() };
  return {
    cx, cz, lod, x0, z0, size: L.size, terrain, water: waterM, paddy: paddyM, inst,
    tuft: { m: tufts.out(), c: tuftC.out() }, lights: kit.lights.out(),
    spots: { petal: kit.spots.petal.out(), smoke: kit.spots.smoke.out(), fly: kit.spots.fly.out() },
  };
}

function slopeAt(k, raw, W) { return Math.max(Math.abs(raw[k] - raw[k + 1]), Math.abs(raw[k] - raw[k - 1]), Math.abs(raw[k] - raw[k + W]), Math.abs(raw[k] - raw[k - W])); }

function decorate(x0, z0, size, info, hq, raw, W, cellK, inChunk, tufts, tuftC, levee) {
  const m16 = new Float64Array(16);
  const placeOK = (s, k) => s.h > 0.35 && !s.street && s.rail < 0.05 && s.path < 0.2 && s.pad < 0.15 && !s.paddy && slopeAt(k, raw, W) < 1.5 && s.tunnel === 0;
  // trees on a jittered 6 m grid
  const g = 6;
  for (let gz = Math.floor(z0 / g); gz * g < z0 + size; gz++) for (let gx = Math.floor(x0 / g); gx * g < x0 + size; gx++) {
    const r = h2(gx, gz, SALT[40]), r2 = h2(gx, gz, SALT[41]);
    const x = gx * g + h2(gx, gz, SALT[42]) * g, z = gz * g + h2(gx, gz, SALT[43]) * g;
    if (!inChunk(x, z)) continue;
    const k = cellK(x, z), s = info[k];
    const seed = (h2(gx, gz, SALT[44]) * 1e9) | 0;
    const nearWater = s.h < 2.6 && (s.lake > 0.08 || s.valley > 0.3 || s.river > 0.05);
    if (s.paddy) {
      if (levee[k] && r < 0.025) cherryTree(x, z, 'yama', seed, 0.8, 0.45);
      else if (!levee[k] && r > 0.985) scarecrow(x, z, r2 * 6);
      continue;
    }
    if (!placeOK(s, k)) continue;
    switch (s.biome) {
      case B.SAKURA:
        if (r < 0.5) cherryTree(x, z, r2 < 0.05 ? 'ancient' : (r2 < 0.55 ? 'pale' : 'yama'), seed, 0.8 + r2 * 0.35, r2 < 0.05 ? 0.8 : 0.5);
        else if (r < 0.62) bush(x, z, 0.7 + r2 * 0.6, seed, 0.3);
        break;
      case B.SATO:
        if (nearWater && r < 0.2) cherryTree(x, z, r2 < 0.4 ? 'shidare' : 'yama', seed, 0.85, 0.5);
        else if (r < 0.09) cherryTree(x, z, r2 < 0.5 ? 'yama' : 'pale', seed, 0.8 + r2 * 0.3, 0.5);
        else if (r < 0.2) broadleaf(x, z, 0.8 + r2 * 0.6, seed);
        else if (r < 0.23) persimmon(x, z, seed);
        else if (r < 0.28) conifer(x, z, 0.9 + r2 * 0.6, seed);
        else if (r < 0.34) bush(x, z, 0.6 + r2 * 0.6, seed, r2 > 0.6 ? 0.4 : 0);
        break;
      case B.CEDAR:
        if (r < 0.78) conifer(x, z, 1.1 + r2 * 0.9, seed);
        else if (r < 0.83) cherryTree(x, z, 'yama', seed, 0.8, 0.45);
        else if (r < 0.9) rock(x, z, 0.6 + r2 * 1.2, seed);
        break;
      case B.BAMBOO:
        if (r < 0.12) conifer(x, z, 1.0 + r2 * 0.6, seed);
        break;
      case B.SNOW:
        if (s.h < s.snowLine + 22 && r < 0.3) conifer(x, z, 0.9 + r2 * 0.7, seed, true);
        else if (r < 0.42) rock(x, z, 0.8 + r2 * 1.6, seed, { snow: s.snow });
        break;
      case B.MEADOW:
        if (r < 0.012) cherryTree(x, z, r2 < 0.5 ? 'yama' : 'pale', seed, 0.85, 0.55);
        else if (r < 0.03) bush(x, z, 0.7 + r2 * 0.6, seed, 0.5);
        else if (r < 0.045) wildflowers(x, z, seed);
        break;
      case B.MARSH:
        if (s.h < 0.6 && r < 0.16) lotus(x, z, seed);
        else if (r < 0.3) cattail(x, z, seed);
        else if (r < 0.36) bush(x, z, 0.7 + r2 * 0.5, seed, 0.1);
        else if (r < 0.385) marshTree(x, z, seed);
        else if (r < 0.4) hydrangea(x, z, seed);
        break;
      case B.PINE:
        if (r < 0.15) conifer(x, z, 1.0 + r2 * 0.8, seed);
        else if (r < 0.34) fern(x, z, seed);
        else if (r < 0.37) rock(x, z, 0.5 + r2 * 1.0, seed);
        break;
      case B.BEACH:
        if (s.h > 0.9 && r < 0.2) pine(x, z, 0.8 + r2 * 0.5, seed);
        else if (r < 0.32) rock(x, z, 0.5 + r2 * 1.2, seed, { wet: s.h < 0.8 });
        break;
      case B.TOWN:
        if (nearWater && r < 0.35) willow(x, z, seed);
        break;
    }
  }
  // rice seedlings on flooded plates
  const gR = 1.1;
  for (let gz = Math.floor(z0 / gR); gz * gR < z0 + size; gz++) for (let gx = Math.floor(x0 / gR); gx * gR < x0 + size; gx++) {
    const x = gx * gR + h2(gx, gz, SALT[63]) * gR, z = gz * gR + h2(gx, gz, SALT[64]) * gR;
    if (!inChunk(x, z)) continue;
    const k = cellK(x, z), s = info[k];
    if (!s.paddy || levee[k]) continue;
    if (h2(gx, gz, SALT[65]) < 0.75) {
      const rr = h2(gx, gz, SALT[66]);
      const c = C([0x7aa24a, 0x6d9440, 0x86ab52][Math.floor(rr * 3)]);
      const H = 0.35 + rr * 0.25;
      kit.box('solid', x, kit.G(x, z) + 0.14 + H / 2, z, 0.07, H, 0.07, c, (rr - 0.5) * 0.2, rr * 6, (rr - 0.5) * 0.2);
      kit.box('solid', x, kit.G(x, z) + 0.14 + H, z, 0.14, 0.08, 0.14, C(0x93b45e).multiplyScalar(0.9 + rr * 0.2), 0, rr * 6, 0);
    }

    const x = gx * gRe + h2(gx, gz, SALT[67]) * gRe, z = gz * gRe + h2(gx, gz, SALT[68]) * gRe;
    if (!inChunk(x, z)) continue;
    const k = cellK(x, z), s = info[k];

    if (!wetShore || s.street || s.rail > 0.1 || s.pad > 0.1) continue;
    if (h2(gx, gz, SALT[69]) > 0.62) continue;
    const n = 2 + Math.floor(h2(gx, gz, SALT[70]) * 3);
    for (let j = 0; j < n; j++) {
      const rx = x + (h2(gx, j, SALT[71]) - 0.5) * 1.6, rz = z + (h2(gz, j, SALT[72]) - 0.5) * 1.6;
      const rk = cellK(rx, rz); if (rk < 0) continue;
      const rs = info[rk];
      if (rs.h > 0.8 || rs.h < -1.4) continue;
      const y = kit.G(rx, rz);
      const hh = 1.5 + h2(gx, gz + j, SALT[73]) * 1.1;
      const c = C([0x9aa86a, 0x8a9c5e, 0xa8b478][j % 3]).multiplyScalar(0.85 + h2(j, gz, 5) * 0.3);
      kit.box('solid', rx, y + hh / 2, rz, 0.05, hh, 0.05, c, (h2(j, gx, 6) - 0.5) * 0.24, h2(j, gz, 7) * 6, (h2(j, gx, 8) - 0.5) * 0.24);
      if (j % 2 === 0) kit.box('solid', rx, y + hh + 0.12, rz, 0.07, 0.42, 0.07, C(0xb8a878).multiplyScalar(0.9 + h2(j, gz, 9) * 0.2), 0, 0, (h2(j, gx, 10) - 0.5) * 0.3);
    }
  }
  // bamboo culms (dense grid)
  const gb = 2.3;
  for (let gz = Math.floor(z0 / gb); gz * gb < z0 + size; gz++) for (let gx = Math.floor(x0 / gb); gx * gb < x0 + size; gx++) {
    const x = gx * gb + h2(gx, gz, SALT[45]) * gb, z = gz * gb + h2(gx, gz, SALT[46]) * gb;
    if (!inChunk(x, z)) continue;
    const k = cellK(x, z), s = info[k];
    if (s.biome !== B.BAMBOO || !placeOK(s, k)) continue;
    if (h2(gx, gz, SALT[47]) < 0.42) bamboo(x, z, (h2(gx, gz, SALT[48]) * 1e9) | 0);
  }
  // rocks along water, stone lanterns on lanes
  const gr = 7;
  for (let gz = Math.floor(z0 / gr); gz * gr < z0 + size; gz++) for (let gx = Math.floor(x0 / gr); gx * gr < x0 + size; gx++) {
    const x = gx * gr + h2(gx, gz, SALT[49]) * gr, z = gz * gr + h2(gx, gz, SALT[50]) * gr;
    if (!inChunk(x, z)) continue;
    const k = cellK(x, z), s = info[k], r = h2(gx, gz, SALT[51]);
    if (s.h > -0.8 && s.h < 0.6 && s.pad < 0.1 && r < 0.35) rock(x, z, 0.4 + r * 2.2, (r * 1e9) | 0, { wet: true, y: Math.max(hq[k], -0.6) });
  }
  const gl = 28;

      gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(0.025, t + 0.015); gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
      o.connect(gg); gg.connect(master); o.start(t); o.stop(t + 0.13);
    }
  }
  function insect() {
    const t = ctx.currentTime, o = ctx.createOscillator(), am = ctx.createOscillator(), ag = ctx.createGain(), gg = ctx.createGain();
    o.frequency.value = 4200 + Math.random() * 600; am.frequency.value = 38; ag.gain.value = 0.5;
    am.connect(ag); ag.connect(gg.gain);
    gg.gain.setValueAtTime(0, t); gg.gain.linearRampToValueAtTime(0.006, t + 0.3); gg.gain.linearRampToValueAtTime(0, t + 1.6);
    o.connect(gg); gg.connect(master); o.start(t); am.start(t); o.stop(t + 1.7); am.stop(t + 1.7);
  }
  function schedule() {
    const L = LEVELS[mood] || LEVELS.dusk;
    if (Math.random() < 0.35 * L.chime) chime();
    if (Math.random() < 0.5 * L.birds) bird();
    if (Math.random() < 0.4 * L.insects) insect();

  }
  function levels(fade = 2) { if (!ctx) return; const L = LEVELS[mood] || LEVELS.dusk, t = ctx.currentTime; for (const k of ['stream', 'wind', 'rain']) g[k].gain.setTargetAtTime(L[k], t, fade / 3); }
  return {
    async toggle() {
      if (!on) { if (!ctx) build(); await ctx.resume(); on = true; levels(0.5); master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.6); schedule(); }
      else { on = false; clearTimeout(timer); master.gain.setTargetAtTime(0, ctx.currentTime, 0.3); setTimeout(() => { if (!on && ctx) ctx.suspend(); }, 1500); }
      const b = $('btnSound');
      if (b) { b.setAttribute('aria-pressed', String(on)); const o1 = b.querySelector('.snd-on'), o2 = b.querySelector('.snd-off'); if (o1) o1.style.display = on ? '' : 'none'; if (o2) o2.style.display = on ? 'none' : ''; }
      return on;
    },
    setMood(m) { mood = m; levels(); },
  };
})();
if ($('btnTour')) $('btnTour').addEventListener('click', () => startTour());
if ($('btnShot')) $('btnShot').addEventListener('click', saveImage);
if ($('btnSound')) $('btnSound').addEventListener('click', async () => {
  try { const on = await audio.toggle(); toast(on ? 'Ambient sound on' : 'Sound off'); } catch (e) { toast('Audio not available'); }
});
document.querySelectorAll('#moods button').forEach((b) => b.addEventListener('click', () => setMood(b.dataset.mood)));
// --- main loop -----------------------------------------------------------
let clockT = 0, lastNow = performance.now(), fpsN = 0, fpsT = 0, fpsShow = 60, autoChecked = QS.has('q');
let mirrorFrame = 0;
function renderFrame(dt) {
  sky.position.copy(camera.position);
  grade.uniforms.uTime.value = clockT;
  composer.render(dt);
}
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
  lastNow = now;
  if (document.hidden) return;
  clockT += dt;
  TIME_U.value = clockT; SKY_U.uTime.value = clockT;
  updateMood(dt);
  updateCamera(dt);
  streamUpdate(camera.position);
  integrateSome(QUALITY === 'high' ? 4 : 6);
  updateShadow(dt);
  if (STREAM.visibleWater && (mirrorFrame = (mirrorFrame + 1) % (QUALITY === 'high' ? 1 : 2)) === 0) { WATER_U.uMirrorOn.value = 1; renderMirror(); }
  updateLamps(dt, ATM.lamps);
  updateTrain(dt, clockT);
  updateSmoke(dt);
  updatePetals(dt, clockT);
  updateFlies(dt);
  updateWeather(dt);
  updateBirds(clockT);
  updateFauna(dt, clockT);
  updateHUD(dt);
  renderFrame(dt);
  fpsN++; fpsT += dt; if (window.__frameHook) window.__frameHook();
  if (fpsT >= 0.5) { fpsShow = fpsN / fpsT; fpsN = 0; fpsT = 0; $('fpsVal').textContent = Math.round(fpsShow); }
  if (!autoChecked && clockT > 3) {
    if (fpsShow < 40 && prScale > 0.7) { prScale = Math.max(0.7, prScale - 0.15); applyQuality(QUALITY); }
    else if (fpsShow < 24 && QUALITY === 'high') { prScale = 1; applyQuality('lite'); toast('Switched to Lite rendering for smoother motion'); autoChecked = true; }
    else if (fpsShow >= 40) autoChecked = true;
  }
}
function applyQuality(q) {
  QUALITY = q;
  const pr = pixelRatioFor(q);
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr);
  const ms = q === 'high' ? 4 : 2;
  for (const r of [composer.renderTarget1, composer.renderTarget2]) if (r.samples !== ms) { r.samples = ms; r.dispose(); }
  renderer.shadowMap.needsUpdate = true;
  resize();
  applyAtmosphere();
}
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  volPass.setSize(w, h);
  FX.flies.pts.material.uniforms.uPx.value = renderer.getPixelRatio() * h / 900;
  FX.smoke.pts.material.uniforms.uPx.value = renderer.getPixelRatio() * h / 900;
  FX.snow.material.uniforms.uPx.value = renderer.getPixelRatio() * h / 900;
}
window.addEventListener('resize', resize);
// --- boot ----------------------------------------------------------------
setProgress(0.2, 'Searching for a good vantage…');
await nextFrame();
const spawn = GEN.findSpawn();
mark('spawn');
setProgress(0.3, 'Generating the first chunks…');
await nextFrame();
{
  const L0 = GEN.LODS[0], cx = Math.round(spawn.target[0] / L0.size), cz = Math.round(spawn.target[2] / L0.size);
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const c = GEN.genChunk(cx + i, cz + j, 0);
    integrate({ key: KEY(0, cx + i, cz + j), gen: genTag, c });
  }
  mark('primed');
}
snapTo(spawn.pos, Math.atan2(spawn.target[0] - spawn.pos[0], spawn.target[2] - spawn.pos[2]), Math.atan2(spawn.target[1] - spawn.pos[1], Math.hypot(spawn.target[0] - spawn.pos[0], spawn.target[2] - spawn.pos[2])), 55);
camera.position.copy(camS.pos);
setProgress(0.5, 'Weaving the light…');
await nextFrame();
applyQuality(QUALITY);
setMood(moodName, true);
refreshEnv();
updateShadow(0, true);
setProgress(0.7, 'Compiling shaders…');
await nextFrame();
try { await renderer.compileAsync(scene, camera); } catch (e) { /* compile lazily */ }
mark('compiled');
renderFrame(0);
setProgress(1, 'Welcome to the valley');
booted = true;
$('hud').hidden = false;
window.__sv = {
  ready: true, GEN, camera, scene, renderer, teleport, setMood, applyQuality, startTour, stopTour, saveImage,
  ST, STREAM, key, keys, MOVE, FAUNA,
  goCam(x, y, z, tx, ty, tz) { snapTo([x, y, z], Math.atan2(tx - x, tz - z), Math.atan2(ty - y, Math.hypot(tx - x, tz - z)), 55); introT = 1; },
  get state() { return { seed: SEED, mood: moodName, quality: QUALITY, biome: HUD.biome >= 0 ? GEN.BIOME_NAMES[HUD.biome][1] : '?' }; },
};
requestAnimationFrame((t) => { lastNow = t; loop(t); });
setTimeout(() => { $('loader').classList.add('done'); setTimeout(() => { const l = $('loader'); if (l) l.remove(); }, 1200); }, 250);
if (!interacted) setTimeout(() => toast('Drag to look around · Scroll or W A S D to explore'), 2500);
window.__tp = async (key) => { await teleport(key); await new Promise(r=>setTimeout(r,800)); return JSON.stringify({cam:[camera.position.x|0, camera.position.y|0, camera.position.z|0]}); };
