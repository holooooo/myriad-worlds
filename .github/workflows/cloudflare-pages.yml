name: Verify and publish Myriad Worlds
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      deploy_ready: ${{ steps.cloudflare.outputs.ready }}
      branch: ${{ steps.target.outputs.branch }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: myriad-worlds-site
          path: dist
          retention-days: 7
          if-no-files-found: error
      - name: Select production or isolated preview
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re
          if os.environ['EVENT_NAME'] == 'pull_request':
              branch = 'pr-' + os.environ['PR_NUMBER']
          elif os.environ['REF_NAME'] == 'main':
              branch = 'main'
          else:
              ref = os.environ['REF_NAME']
              slug = re.sub(r'[^a-z0-9-]+', '-', ref.lower()).strip('-')[:24] or 'branch'
              suffix = hashlib.sha256(ref.encode()).hexdigest()[:8]
              branch = f'preview-{slug}-{suffix}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'branch={branch}', file=output)
              print('environment=' + ('production' if branch == 'main' else 'preview'), file=output)
          PY
      - name: Check deployment configuration
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build verified. Pages deployment is skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are configured. Fork pull requests intentionally receive no deployment credentials.'
          fi
  deploy:
    if: >-
      needs.verify.outputs.deploy_ready == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: pages-deploy-${{ needs.verify.outputs.branch }}
      cancel-in-progress: true
    environment:
      name: ${{ needs.verify.outputs.environment }}
      url: ${{ steps.publish.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: myriad-worlds-site
          path: dist
      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.120.0'
          command: pages deploy dist --project-name=myriad-worlds --branch=${{ needs.verify.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Add preview links to run summary
        env:
          DEPLOYMENT_URL: ${{ steps.publish.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.publish.outputs.pages-deployment-alias-url }}
          DEPLOY_BRANCH: ${{ needs.verify.outputs.branch }}
        run: |
          {
            echo '## Cloudflare Pages'
            echo
            echo "- Branch: \`$DEPLOY_BRANCH\`"
            echo "- Deployment: $DEPLOYMENT_URL"
            if [ -n "$ALIAS_URL" ]; then
              echo "- Branch preview: $ALIAS_URL"
            fi
            if [ "$DEPLOY_BRANCH" = 'main' ]; then
              echo '- Production: https://myriad-worlds.pages.dev/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
